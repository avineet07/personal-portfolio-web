<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgProxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="gridProxy" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arwBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arwGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arwSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="440" rx="14" fill="url(#bgProxy)"/>
  <rect width="820" height="440" rx="14" fill="url(#gridProxy)"/>

  <!-- Top Title Badge -->
  <rect x="45" y="24" width="170" height="26" rx="6" fill="#0ea5e9" opacity="0.16"/>
  <text x="57" y="42" fill="#38bdf8" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">CLOUD &amp; NETWORKING</text>
  <text x="45" y="76" fill="#f8fafc" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="20">AWS EC2 Layer 7 Smart HTTP Proxy Architecture</text>
  <text x="45" y="96" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="12">Domain-Level Split Routing &amp; GeoDNS CDN Traversal on Regional Edge</text>

  <!-- Node 1: Client & PAC Splitter -->
  <g transform="translate(45, 120)" filter="url(#shadowBox)">
    <rect width="135" height="200" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#38bdf8" opacity="0.15"/>
    <text x="18" y="25" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">CLIENT</text>
    
    <!-- Client Icon -->
    <rect x="42" y="42" width="50" height="34" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="36" y1="76" x2="98" y2="76" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="67" cy="60" r="3" fill="#38bdf8"/>

    <text x="14" y="102" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Browser Client</text>
    <text x="14" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Chromium / PAC</text>
    <text x="14" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Zero Omega Router</text>

    <rect x="12" y="152" width="111" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="167" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">PAC Split Logic</text>
    <text x="18" y="179" fill="#64748b" font-family="'Inter', sans-serif" font-size="8.5">Pre-DNS Intercept</text>
  </g>

  <!-- Split Arrow to AWS -->
  <path d="M 180 185 L 230 185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arwBlue)"/>
  <text x="183" y="175" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600">Target Match</text>

  <!-- Direct Route Arrow Below -->
  <path d="M 180 270 L 255 270 L 255 365 L 720 365" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arwSlate)"/>
  <text x="270" y="358" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Non-Target Traffic: Direct Home ISP (0 MB Cloud Cost)</text>

  <!-- Node 2: Security & IAM Boundary -->
  <g transform="translate(235, 120)" filter="url(#shadowBox)">
    <rect width="135" height="200" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="80" height="18" rx="4" fill="#f59e0b" opacity="0.15"/>
    <text x="18" y="25" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">PERIMETER</text>
    
    <!-- Shield Icon -->
    <path d="M 67 42 L 87 50 L 87 64 C 87 76 67 86 67 86 C 67 86 47 76 47 64 L 47 50 Z" fill="none" stroke="#fbbf24" stroke-width="1.8"/>

    <text x="14" y="102" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">AWS Security</text>
    <text x="14" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Security Group</text>
    <text x="14" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">SSH Port 22 /32</text>

    <rect x="12" y="152" width="111" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="167" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9" font-weight="600">IAM Role + SSM</text>
    <text x="18" y="179" fill="#64748b" font-family="'Inter', sans-serif" font-size="8.5">Keyless Access</text>
  </g>

  <!-- Arrow to EC2 Proxy -->
  <path d="M 370 185 L 420 185" stroke="#f59e0b" stroke-width="2" marker-end="url(#arwBlue)"/>
  <text x="375" y="175" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600">Port 9050</text>

  <!-- Node 3: Tinyproxy Daemon on EC2 -->
  <g transform="translate(425, 120)" filter="url(#shadowBox)">
    <rect width="145" height="200" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="94" height="18" rx="4" fill="#8b5cf6" opacity="0.15"/>
    <text x="18" y="25" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">EC2 INSTANCE</text>
    
    <!-- Server Icon -->
    <rect x="48" y="44" width="48" height="14" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="56" cy="51" r="2" fill="#38bdf8"/>
    <rect x="48" y="62" width="48" height="14" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="56" cy="69" r="2" fill="#10b981"/>

    <text x="14" y="102" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Tinyproxy Engine</text>
    <text x="14" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Ubuntu t3.micro</text>
    <text x="14" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">BasicAuth Enforced</text>

    <rect x="12" y="152" width="121" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="167" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="9" font-weight="600">HTTP CONNECT</text>
    <text x="18" y="179" fill="#64748b" font-family="'Inter', sans-serif" font-size="8.5">Chrome Compatible</text>
  </g>

  <!-- Arrow to Upstream -->
  <path d="M 570 185 L 620 185" stroke="#10b981" stroke-width="2" marker-end="url(#arwGreen)"/>
  <text x="575" y="175" fill="#34d399" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600">Edge Out</text>

  <!-- Node 4: Target Media & Edge CDN -->
  <g transform="translate(625, 120)" filter="url(#shadowBox)">
    <rect width="150" height="200" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="85" height="18" rx="4" fill="#10b981" opacity="0.15"/>
    <text x="18" y="25" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">DESTINATION</text>
    
    <!-- Cloud/Video Icon -->
    <path d="M 52 64 a 12 12 0 0 1 2 -22 a 15 15 0 0 1 30 -4 a 11 11 0 0 1 2 26 z" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <polygon points="68,50 78,56 68,62" fill="#34d399"/>

    <text x="14" y="102" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Media Origin &amp; CDN</text>
    <text x="14" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Edge CDN Clusters</text>
    <text x="14" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">DRM / Token API</text>

    <rect x="12" y="152" width="126" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="167" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="600">1080p60 Live HLS</text>
    <text x="18" y="179" fill="#64748b" font-family="'Inter', sans-serif" font-size="8.5">Regional Egress IP</text>
  </g>

  <!-- Bottom Stats Bar -->
  <g transform="translate(45, 395)">
    <rect width="730" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Key Results:</text>
    <text x="95" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="10">100% Origin Leak Elimination</text>
    <text x="295" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">•</text>
    <text x="315" y="18" fill="#34d399" font-family="'Inter', sans-serif" font-weight="600" font-size="10">0 MB Non-Target Cloud Bandwidth</text>
    <text x="545" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">•</text>
    <text x="565" y="18" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="600" font-size="10">Sub-150ms Streaming Latency</text>
  </g>
</svg>
