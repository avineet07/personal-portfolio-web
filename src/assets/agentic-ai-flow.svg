<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgentic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <pattern id="gridAgentic" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arwAgentic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadowAgentic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="12" fill="url(#bgAgentic)"/>
  <rect width="800" height="420" rx="12" fill="url(#gridAgentic)"/>

  <!-- Title -->
  <rect x="50" y="30" width="128" height="30" rx="6" fill="#3b82f6" opacity="0.15"/>
  <text x="65" y="50" fill="#93c5fd" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" letter-spacing="1.5">AGENTIC AI</text>
  <text x="50" y="90" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="20">Multi-Agent Workflow with Human-in-the-Loop</text>

  <!-- 1. Input -->
  <g transform="translate(50, 110)" filter="url(#shadowAgentic)">
    <rect width="120" height="170" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#3b82f6" opacity="0.15"/>
    <text x="18" y="26" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">INPUT</text>
    <circle cx="60" cy="58" r="15" fill="#3b82f6" opacity="0.15"/>
    <circle cx="60" cy="58" r="5.5" fill="#60a5fa"/>
    <text x="14" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5">User Input</text>
    <text x="14" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Voice / Chat API</text>
    <text x="14" y="138" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Intent &amp; Context</text>
  </g>

  <path d="M 178 195 L 192 195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arwAgentic)"/>

  <!-- 2. Router -->
  <g transform="translate(195, 110)" filter="url(#shadowAgentic)">
    <rect width="120" height="170" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#3b82f6" opacity="0.15"/>
    <text x="18" y="26" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">ROUTER</text>
    <path d="M 60 43 L 73 58 L 60 73 L 47 58 Z" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="60" cy="58" r="4" fill="#93c5fd"/>
    <text x="14" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5">Intent Classifier</text>
    <text x="14" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Conditional Routing</text>
    <text x="14" y="138" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Low Token Overhead</text>
  </g>

  <path d="M 318 195 L 332 195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arwAgentic)"/>

  <!-- 3. Workers -->
  <g transform="translate(340, 110)" filter="url(#shadowAgentic)">
    <rect width="120" height="170" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#3b82f6" opacity="0.15"/>
    <text x="18" y="26" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">WORKERS</text>
    <circle cx="50" cy="58" r="6" fill="#60a5fa" opacity="0.35"/>
    <circle cx="70" cy="58" r="6" fill="#60a5fa" opacity="0.35"/>
    <path d="M 56 58 L 64 58" stroke="#60a5fa" stroke-width="2"/>
    <text x="14" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5">Specialized Agents</text>
    <text x="14" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Tool &amp; Policy Agents</text>
    <text x="14" y="138" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Parallel Execution</text>
  </g>

  <path d="M 468 195 L 482 195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arwAgentic)"/>

  <!-- 4. HITL gate -->
  <g transform="translate(490, 110)" filter="url(#shadowAgentic)">
    <rect width="120" height="170" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#f59e0b" opacity="0.15"/>
    <text x="18" y="26" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">HITL GATE</text>
    <path d="M 60 44 L 74 48 L 74 62 L 60 70 L 46 62 L 46 48 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="14" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5">Human Approval</text>
    <text x="14" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Safety Boundary</text>
    <text x="14" y="138" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Operator Sign-off</text>
  </g>

  <path d="M 618 195 L 632 195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arwAgentic)"/>

  <!-- 5. Output -->
  <g transform="translate(640, 110)" filter="url(#shadowAgentic)">
    <rect width="120" height="170" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#3b82f6" opacity="0.15"/>
    <text x="18" y="26" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">OUTPUT</text>
    <path d="M 46 63 L 58 58 L 68 65 L 74 60 L 66 60 L 60 66 L 54 60 Z" fill="#60a5fa"/>
    <text x="14" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5">Verified Action</text>
    <text x="14" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Evaluated &amp; Logged</text>
    <text x="14" y="138" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Zero False Actions</text>
  </g>

  <!-- Bottom metric pills -->
  <g transform="translate(50, 335)">
    <rect width="160" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="15">-35%</text>
    <text x="15" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Token Consumption</text>

    <rect x="200" y="0" width="160" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="215" y="24" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="700" font-size="15">0% Errors</text>
    <text x="215" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Human-in-the-Loop Safe</text>

    <rect x="350" y="0" width="160" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="365" y="24" fill="#a78bfa" font-family="'Inter', sans-serif" font-weight="700" font-size="15">+10% Lift</text>
    <text x="365" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Evaluator Accuracy</text>

    <rect x="500" y="0" width="160" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="515" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="15">100% Traced</text>
    <text x="515" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Run-level Observability</text>
  </g>
</svg>
